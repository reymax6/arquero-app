# Runs the full check suite on every push and pull request.
#
# The point of this file is that the security and accessibility work doesn't
# quietly rot. If a future change reintroduces an XSS hole, drops contrast
# below 4.5:1, or breaks keyboard booking, this goes red before it ships.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run every check
        run: npm test
