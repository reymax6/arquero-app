<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#173129">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Page not found — Arquero's Mountain Resort</title>
<style>
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/fraunces-latin-600-normal.woff2') format('woff2');}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/fraunces-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/inter-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/inter-latin-600-normal.woff2') format('woff2');}

  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#faf5ea; line-height:1.55;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(212,162,76,.20), transparent 62%),
      linear-gradient(180deg,#24463a 0%, #173129 100%);
  }
  .card{max-width:460px; text-align:center;}
  .mark{
    width:56px;height:56px;border-radius:15px;margin:0 auto 22px;
    background:linear-gradient(160deg,#d4a24c,#a3502c);
    display:flex;align-items:center;justify-content:center;
  }
  .mark svg{width:31px;height:31px;}
  .kicker{
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:#e8c27a;font-weight:700;margin-bottom:12px;
  }
  h1{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:700;margin-bottom:12px;line-height:1.2;}
  p{font-size:14.5px;color:#dbe6df;margin-bottom:26px;}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  a.btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;padding:12px 20px;border-radius:12px;
    font-size:13.5px;font-weight:600;text-decoration:none;
  }
  a.primary{background:#a3502c;color:#fff;}
  a.ghost{background:rgba(255,255,255,.12);color:#faf5ea;border:1px solid rgba(255,255,255,.42);}
  a.btn:focus-visible{outline:3px solid #e8c27a;outline-offset:2px;}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#173129" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8H3z"/><circle cx="17" cy="6" r="2"/></svg>
    </div>
    <div class="kicker">Arquero's Mountain Resort</div>
    <h1>This trail doesn't lead anywhere</h1>
    <p>We couldn't find that page. It may have moved, or the link might have a typo in it.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to the app</a>
      <a class="btn ghost" href="/#screen-courts">Book a court</a>
    </div>
  </main>
</body>
</html>
